[pytest]
# 测试就在项目根目录
testpaths = .
python_files = test_*.py

# 不要去这些目录里找测试：
#   chroma_db          向量库，文件多且不是测试
#   __pycache__/.git   缓存与版本库
#   pytest-cache-files-*  pytest 写缓存失败时留下的临时目录
norecursedirs = .git __pycache__ chroma_db pytest-cache-files-* node_modules

# 让 parametrize 的用例 ID 直接显示中文，而不是 \u9875\u7709 这种转义。
# （pytest 出于兼容性默认转义非 ASCII 字符）
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
